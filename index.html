<style>
:root {
  --bg: #1C1A16;
  --panel: #262218;
  --panel-2: #322C1E;
  --paper: #EFE6D3;
  --paper-dim: #C9BFA8;
  --ink: #EFE6D3;
  --ink-dim: #A69D89;
  --mustard: #D9A62E;
  --mustard-ink: #3A2A05;
  --rust: #C0562F;
  --olive: #7E9A5C;
  --olive-ink: #16210C;
  --border: #4A4231;
  --border-strong: #6B6146;
  --radius: 10px;
  --font-display: 'Fraunces', serif;
  --font-body: 'IBM Plex Sans', sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #EFE6D3;
    --panel: #F8F2E4;
    --panel-2: #FFFFFF;
    --paper: #262218;
    --paper-dim: #4A4231;
    --ink: #262218;
    --ink-dim: #6B6146;
    --border: #D8CCAE;
    --border-strong: #C9BFA8;
  }
}
* { box-sizing: border-box; }
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 480px;
  margin: 0 auto;
  padding: 20px 18px 48px;
}
.top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 18px;
}
.wordmark {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 22px;
  letter-spacing: -0.01em;
  color: var(--mustard);
}
.wordmark span { color: var(--ink); }
.tally {
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  color: var(--ink-dim);
  text-align: right;
  line-height: 1.4;
}
.tally .score {
  color: var(--mustard);
  font-weight: 600;
}

.capture {
  position: relative;
  border: 1.5px dashed var(--border-strong);
  border-radius: var(--radius);
  background: var(--panel);
  aspect-ratio: 1 / 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  cursor: pointer;
}
.capture:focus-within {
  outline: 2px solid var(--mustard);
  outline-offset: 2px;
}
.capture img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.capture-prompt {
  text-align: center;
  padding: 24px;
  color: var(--ink-dim);
}
.capture-prompt .disc {
  width: 46px;
  height: 46px;
  margin: 0 auto 14px;
  border-radius: 50%;
  border: 2px solid var(--border-strong);
  position: relative;
}
.capture-prompt .disc::after {
  content: "";
  position: absolute;
  inset: 40%;
  border-radius: 50%;
  background: var(--border-strong);
}
.capture-prompt p {
  margin: 0;
  font-size: 14px;
}
.capture input[type="file"] {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
}

.status-line {
  margin-top: 10px;
  min-height: 20px;
  font-size: 13px;
  color: var(--ink-dim);
  display: flex;
  align-items: center;
  gap: 8px;
}
.status-line .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--mustard);
  flex-shrink: 0;
  animation: pulse 1.1s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce) {
  .status-line .dot { animation: none; }
}
@keyframes pulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

.searchrow {
  margin-top: 22px;
}
.searchrow label {
  display: block;
  font-size: 13px;
  color: var(--ink-dim);
  margin-bottom: 6px;
}
.searchrow input[type="text"] {
  width: 100%;
  padding: 12px 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
}
.searchrow input[type="text"]:focus {
  outline: 2px solid var(--mustard);
  outline-offset: 1px;
  border-color: var(--mustard);
}
.searchrow input::placeholder { color: var(--ink-dim); }

.results {
  margin-top: 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.results-heading {
  font-size: 13px;
  color: var(--ink-dim);
  margin-bottom: 2px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-left: 3px solid var(--border-strong);
  border-radius: 0 var(--radius) var(--radius) 0;
  padding: 14px 16px;
}
.card.match {
  border-left-color: var(--olive);
  background: var(--panel-2);
}
.card-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 4px;
}
.card-rank {
  font-variant-numeric: tabular-nums;
  font-size: 12px;
  color: var(--ink-dim);
}
.card-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 3px;
  background: var(--olive);
  color: var(--olive-ink);
  font-weight: 600;
  white-space: nowrap;
}
.card-badge.maybe {
  background: var(--mustard);
  color: var(--mustard-ink);
}
.card-title {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 17px;
  line-height: 1.3;
  margin: 0 0 2px;
}
.card-artist {
  font-size: 14px;
  color: var(--ink-dim);
  margin: 0;
}
.card-note {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
  font-size: 13px;
  color: var(--rust);
}

.card-unlock {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.card-unlock .tier {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 15px;
  color: var(--olive);
}
.card-unlock .pts {
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  font-weight: 600;
  color: var(--mustard);
  white-space: nowrap;
}
.card-unlock .bonus {
  display: block;
  font-size: 11px;
  font-weight: 400;
  color: var(--rust);
}
.card.fresh {
  animation: unlock 0.5s ease-out;
}
@media (prefers-reduced-motion: reduce) {
  .card.fresh { animation: none; }
}
@keyframes unlock {
  0% { transform: scale(0.97); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.card-found-before {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--ink-dim);
}
.card-confirm {
  display: block;
  width: 100%;
  margin-top: 10px;
  padding: 10px 12px;
  background: transparent;
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 600;
  text-align: center;
  cursor: pointer;
}
.card-confirm:hover, .card-confirm:focus-visible {
  background: var(--mustard);
  border-color: var(--mustard);
  color: var(--mustard-ink);
  outline: none;
}

.empty {
  margin-top: 24px;
  padding: 18px 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
  font-size: 14px;
  color: var(--ink-dim);
}
.empty strong { color: var(--ink); font-weight: 500; }

.foot {
  margin-top: 36px;
  font-size: 12px;
  color: var(--ink-dim);
  line-height: 1.6;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="wordmark">Break<span> Check</span></div>
    <div class="tally" id="tally"></div>
  </div>

  <label class="capture" id="captureLabel">
    <div class="capture-prompt" id="capturePrompt">
      <div class="disc"></div>
      <p>Take a photo of the sleeve</p>
    </div>
    <input type="file" accept="image/*" capture="environment" id="fileInput">
  </label>

  <div class="status-line" id="statusLine"></div>

  <div class="searchrow">
    <label for="searchBox">Title or artist</label>
    <input type="text" id="searchBox" placeholder="Type it in, or let the photo fill this">
  </div>

  <div id="resultsArea"></div>

  <div class="foot">
    Matched against a list of 2,140 records with a known open drum break.
    On-device text reading — the photo never leaves your phone.
  </div>

</div>

const tallyEl = document.getElementById('tally');

function normalize(s) {
  return (s || '')
    .toLowerCase()
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9\s]/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}
function tokenize(s) {
  return normalize(s).split(' ').filter(function (w) { return w.length >= 3; });
}
function levenshtein(a, b) {
  var m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  var prev = new Array(n + 1), curr = new Array(n + 1);
  for (var j = 0; j <= n; j++) prev[j] = j;
  for (var i = 1; i <= m; i++) {
    curr[0] = i;
    for (j = 1; j <= n; j++) {
      var cost = a[i - 1] === b[j - 1] ? 0 : 1;
      curr[j] = Math.min(prev[j] + 1, curr[j - 1] + 1, prev[j - 1] + cost);
    }
    var tmp = prev; prev = curr; curr = tmp;
  }
  return prev[n];
}
function tokensClose(a, b) {
  if (a === b) return true;
  var maxLen = Math.max(a.length, b.length);
  if (maxLen < 4) return false;
  var dist = levenshtein(a, b);
  return dist <= 2 && dist <= Math.floor(maxLen * 0.3);
}

var INDEX = DATA.map(function (row) {
  return {
    rank: row[0],
    title: row[1],
    artist: row[2],
    note: row[3],
    copies: row[4],
    titleTokens: tokenize(row[1]),
    artistTokens: tokenize(row[2])
  };
});

/* ---- rarity tiers, drawn from each record's real Discogs listing count ---- */
function tierFor(copies) {
  if (copies == null) return { label: 'Undocumented', points: 20 };
  if (copies <= 1) return { label: 'Grail', points: 100 };
  if (copies <= 4) return { label: 'White whale', points: 60 };
  if (copies <= 10) return { label: 'Deep cut', points: 30 };
  if (copies <= 25) return { label: 'Crate find', points: 15 };
  return { label: 'Bin filler', points: 5 };
}

/* ---- personal progress: found records + score, private to this browser ---- */
var PROGRESS_KEY = 'breakcheck_progress_v1';
function loadProgress() {
  try {
    var raw = window.localStorage.getItem(PROGRESS_KEY);
    var p = raw ? JSON.parse(raw) : null;
    if (!p || typeof p !== 'object' || !p.found) return { found: {}, score: 0 };
    return p;
  } catch (e) {
    return { found: {}, score: 0 };
  }
}
function saveProgress(p) {
  try { window.localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); } catch (e) {}
}
var progress = loadProgress();

function renderTally() {
  var foundCount = Object.keys(progress.found).length;
  tallyEl.innerHTML = foundCount.toLocaleString() + ' / ' + DATA.length.toLocaleString() + ' found<br>' +
    '<span class="score">' + progress.score.toLocaleString() + ' pts</span>';
}
renderTally();

function scoreEntry(queryTokens, entry) {
  var pool = entry.titleTokens.concat(entry.artistTokens);
  if (pool.length === 0 || queryTokens.length === 0) return 0;
  var used = {};
  var matched = 0;
  for (var i = 0; i < pool.length; i++) {
    for (var qi = 0; qi < queryTokens.length; qi++) {
      if (used[qi]) continue;
      if (tokensClose(pool[i], queryTokens[qi])) {
        matched++;
        used[qi] = true;
        break;
      }
    }
  }
  return matched / pool.length;
}

var lastQuery = '';

function renderResults(query) {
  var area = document.getElementById('resultsArea');
  var trimmed = query.trim();
  lastQuery = trimmed;
  if (!trimmed) { area.innerHTML = ''; return; }

  var qTokens = tokenize(trimmed);
  if (qTokens.length === 0) { area.innerHTML = ''; return; }

  var scored = INDEX.map(function (e) { return { e: e, s: scoreEntry(qTokens, e) }; })
    .filter(function (x) { return x.s > 0.32; })
    .sort(function (a, b) { return b.s - a.s; })
    .slice(0, 6);

  if (scored.length === 0) {
    area.innerHTML =
      '<div class="empty"><strong>No match in the 2,140.</strong><br>' +
      'That doesn\u2019t mean it\u2019s clean \u2014 just that this list hasn\u2019t catalogued a break for it. ' +
      'Try fewer words, or just the artist name.</div>';
    return;
  }

  var html = '<div class="results"><div class="results-heading">' +
    (scored[0].s >= 0.6 ? 'Best match' : 'Closest matches') + '</div>';

  var thisUnlock = justUnlockedRank;
  justUnlockedRank = null;

  scored.forEach(function (x, i) {
    var e = x.e;
    var isMatch = x.s >= 0.6 && i === 0;
    var already = progress.found[e.rank];
    var isFresh = thisUnlock === e.rank;
    var unlockHtml;

    if (already) {
      unlockHtml = '<div class="card-unlock"><span class="tier">' + escapeHtml(already.tier) +
        (already.bonus ? '<span class="bonus">Bonus dig \u2014 \u00d72</span>' : '') + '</span>' +
        '<span class="pts">+' + already.points + '</span></div>' +
        (isFresh ? '' : '<div class="card-found-before">Found earlier</div>');
    } else {
      unlockHtml = '<button type="button" class="card-confirm" data-rank="' + e.rank + '">This is the one \u2014 found it</button>';
    }

    html += '<div class="card' + (isMatch ? ' match' : '') + (isFresh ? ' fresh' : '') + '">' +
      '<div class="card-top">' +
        '<span class="card-rank">No. ' + e.rank + '</span>' +
        (isMatch ? '<span class="card-badge">Match</span>' : (x.s >= 0.45 ? '<span class="card-badge maybe">Possible</span>' : '')) +
      '</div>' +
      '<p class="card-title">' + escapeHtml(e.title) + '</p>' +
      '<p class="card-artist">' + escapeHtml(e.artist) + '</p>' +
      (e.note ? '<div class="card-note">Break: ' + escapeHtml(e.note) + '</div>' : '') +
      unlockHtml +
      '</div>';
  });
  html += '</div>';
  area.innerHTML = html;

  var buttons = area.querySelectorAll('.card-confirm');
  for (var bi = 0; bi < buttons.length; bi++) {
    buttons[bi].addEventListener('click', function () {
      confirmFind(parseInt(this.getAttribute('data-rank'), 10));
    });
  }
}

var justUnlockedRank = null;
function confirmFind(rank) {
  if (progress.found[rank]) return;
  var entry = null;
  for (var i = 0; i < INDEX.length; i++) {
    if (INDEX[i].rank === rank) { entry = INDEX[i]; break; }
  }
  if (!entry) return;
  var tier = tierFor(entry.copies);
  var bonus = Math.random() < 0.15;
  var pts = bonus ? tier.points * 2 : tier.points;
  progress.found[rank] = { tier: tier.label, points: pts, bonus: bonus };
  progress.score += pts;
  saveProgress(progress);
  renderTally();
  justUnlockedRank = rank;
  renderResults(lastQuery);
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

var searchBox = document.getElementById('searchBox');
var debounceTimer = null;
searchBox.addEventListener('input', function () {
  clearTimeout(debounceTimer);
  var v = searchBox.value;
  debounceTimer = setTimeout(function () { renderResults(v); }, 150);
});

/* ---- photo capture + on-device OCR ---- */
var fileInput = document.getElementById('fileInput');
var capturePrompt = document.getElementById('capturePrompt');
var captureLabel = document.getElementById('captureLabel');
var statusLine = document.getElementById('statusLine');

function setStatus(text, busy) {
  statusLine.innerHTML = busy
    ? '<span class="dot"></span><span>' + escapeHtml(text) + '</span>'
    : escapeHtml(text);
}

var worker = null;
function withTimeout(promise, ms) {
  return new Promise(function (resolve, reject) {
    var settled = false;
    var timer = setTimeout(function () {
      if (settled) return;
      settled = true;
      reject(new Error('timeout'));
    }, ms);
    promise.then(function (v) {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      resolve(v);
    }, function (err) {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      reject(err);
    });
  });
}
async function getWorker() {
  if (worker) return worker;
  worker = await withTimeout(Tesseract.createWorker('eng', 1, {
    workerPath: './tesseract/worker.min.js',
    corePath: './tesseract/tesseract-core-simd-lstm.wasm.js',
    langPath: './tesseract/'
  }), 30000);
  return worker;
}

fileInput.addEventListener('change', async function () {
  var file = fileInput.files && fileInput.files[0];
  if (!file) return;

  var url = URL.createObjectURL(file);
  capturePrompt.outerHTML = '<img src="' + url + '" alt="Photo of the record sleeve">';

  setStatus(worker ? 'Reading the sleeve\u2026' : 'Setting up text reading (first time only)\u2026', true);
  try {
    var w = await getWorker();
    setStatus('Reading the sleeve\u2026', true);
    var result = await withTimeout(w.recognize(file), 20000);
    var text = (result && result.data && result.data.text) ? result.data.text.trim() : '';
    if (text) {
      setStatus('Read: \u201c' + text.replace(/\s+/g, ' ').slice(0, 60) + (text.length > 60 ? '\u2026' : '') + '\u201d');
      searchBox.value = text.replace(/\s+/g, ' ').trim();
      renderResults(searchBox.value);
    } else {
      setStatus('Couldn\u2019t make out any text \u2014 type the title below instead.');
    }
  } catch (err) {
    worker = null; // don't hang on to a worker that may be half-loaded
    setStatus('Reading failed \u2014 type the title below instead.');
  }
});
</script>
